<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <rect width="32" height="32" rx="4" fill="#0f172a" />
  <!-- Cluster links -->
  <line x1="9" y1="10" x2="16" y2="8" stroke="#334155" stroke-width="1.5" />
  <line x1="16" y1="8" x2="14" y2="17" stroke="#334155" stroke-width="1.5" />
  <line x1="9" y1="10" x2="14" y2="17" stroke="#334155" stroke-width="1.5" />
  <line x1="14" y1="17" x2="19" y2="22" stroke="#334155" stroke-width="1.5" />
  <line x1="19" y1="22" x2="11" y2="24" stroke="#334155" stroke-width="1.5" />
  <line x1="14" y1="17" x2="11" y2="24" stroke="#334155" stroke-width="1.5" />

  <!-- Dense Cluster Nodes (Blue / Cyan) -->
  <circle cx="9" cy="10" r="2.5" fill="#38bdf8" />
  <circle cx="16" cy="8" r="2.5" fill="#38bdf8" />
  <circle cx="14" cy="17" r="3" fill="#0284c7" />
