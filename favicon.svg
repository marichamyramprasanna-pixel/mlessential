  <circle cx="25" cy="10" r="3" fill="#ef4444" stroke="#fca5a5" stroke-width="1" />
  <line x1="25" y1="10" x2="28" y2="7" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="1 1" />
</svg>
